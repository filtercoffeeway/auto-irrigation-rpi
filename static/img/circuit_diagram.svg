<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Auto Irrigation wiring diagram</title>
  <style>
    .wire { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .v5   { stroke: #d62839; }
    .gnd  { stroke: #1f2328; }
    .sig  { stroke: #e0a100; }
    .ctl  { stroke: #1f6feb; }
    .v33  { stroke: #bf3989; }
    .box  { fill: #f6f8fa; stroke: #57606a; stroke-width: 2; }
    .h    { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .t    { font-size: 12px; fill: #1f2328; }
    .m    { font-size: 11px; fill: #57606a; }
    .pin  { font-size: 9px; font-weight: 600; text-anchor: middle; }
  </style>

  <!-- background card (keeps the diagram readable in GitHub dark mode) -->
  <rect x="0" y="0" width="960" height="560" rx="16" fill="#ffffff"/>

  <text x="30" y="42" font-size="22" font-weight="700" fill="#1f2328">Auto Irrigation — wiring diagram</text>
  <text x="30" y="64" class="m">Pin numbers are Raspberry Pi physical (BOARD) pins, as used in irrigation_main.py</text>

  <!-- ================= WIRES (drawn first so components sit on top) ================= -->
  <!-- Relay VCC: Pi pin 2 (5V) -->
  <path class="wire v5"  d="M620 200 V110 H420 V200 H380"/>
  <!-- Relay IN1: Pi pin 7 (GPIO4) -->
  <path class="wire ctl" d="M480 290 H380"/>
  <!-- Relay GND: Pi pin 9 -->
  <path class="wire gnd" d="M480 320 H380"/>
  <!-- Sensor VCC: Pi pin 1 (3.3V) - hops over the relay VCC wire -->
  <path class="wire v33" d="M480 200 V150 H612 a8 8 0 0 1 16 0 H700 V230 H760"/>
  <!-- Sensor GND: Pi pin 6 -->
  <path class="wire gnd" d="M620 260 H760"/>
  <!-- Sensor DO: Pi pin 8 (GPIO14) -->
  <path class="wire sig" d="M620 290 H760"/>
  <!-- Pump circuit -->
  <path class="wire gnd" d="M108 250 H220"/>
  <path class="wire v5"  d="M80 278 V380"/>
  <path class="wire gnd" d="M150 410 H180 V280 H220"/>

  <!-- ================= RASPBERRY PI HEADER ================= -->
  <text x="550" y="370" class="h" text-anchor="middle">Raspberry Pi GPIO header</text>
  <rect x="460" y="175" width="180" height="170" rx="8" fill="#e7f5ea" stroke="#2da44e" stroke-width="2"/>
  <g class="t">
    <text x="494" y="204" font-weight="600">3V3</text>
    <text x="494" y="234">GPIO2</text>
    <text x="494" y="264">GPIO3</text>
    <text x="494" y="294" font-weight="600">GPIO4</text>
    <text x="494" y="324" font-weight="600">GND</text>
    <text x="606" y="204" text-anchor="end" font-weight="600">5V</text>
    <text x="606" y="234" text-anchor="end">5V</text>
    <text x="606" y="264" text-anchor="end" font-weight="600">GND</text>
    <text x="606" y="294" text-anchor="end" font-weight="600">GPIO14</text>
    <text x="606" y="324" text-anchor="end">GPIO15</text>
  </g>
  <!-- pins: unused = grey, used = coloured to match wire -->
  <g stroke="#ffffff" stroke-width="1.5">
    <circle cx="480" cy="200" r="10" fill="#bf3989"/>
    <circle cx="620" cy="200" r="10" fill="#d62839"/>
    <circle cx="480" cy="230" r="10" fill="#afb8c1"/>
    <circle cx="620" cy="230" r="10" fill="#afb8c1"/>
    <circle cx="480" cy="260" r="10" fill="#afb8c1"/>
    <circle cx="620" cy="260" r="10" fill="#1f2328"/>
    <circle cx="480" cy="290" r="10" fill="#1f6feb"/>
    <circle cx="620" cy="290" r="10" fill="#e0a100"/>
    <circle cx="480" cy="320" r="10" fill="#1f2328"/>
    <circle cx="620" cy="320" r="10" fill="#afb8c1"/>
  </g>
  <g class="pin" fill="#ffffff">
    <text x="480" y="203">1</text>
    <text x="620" y="203">2</text>
    <text x="480" y="233">3</text>
    <text x="620" y="233">4</text>
    <text x="480" y="263">5</text>
    <text x="620" y="263">6</text>
    <text x="480" y="293">7</text>
    <text x="620" y="293">8</text>
    <text x="480" y="323">9</text>
    <text x="620" y="323">10</text>
  </g>

  <!-- ================= RELAY MODULE ================= -->
  <text x="300" y="162" class="h" text-anchor="middle">5V relay module</text>
  <rect x="220" y="175" width="160" height="170" rx="8" class="box"/>
  <!-- logic side terminals -->
  <g class="t" text-anchor="end">
    <text x="370" y="204">VCC</text>
    <text x="370" y="294">IN1</text>
    <text x="370" y="324">GND</text>
  </g>
  <!-- switch side: NC / COM / NO -->
  <g stroke="#57606a" stroke-width="2" fill="none">
    <path d="M220 220 H290"/>
    <path d="M220 250 H250"/>
    <path d="M220 280 H290"/>
    <!-- lever resting on NC -->
    <path d="M250 250 L288 223" stroke="#1f2328" stroke-width="3"/>
    <!-- swing to NO when energised -->
    <path d="M262 258 Q278 268 284 276" stroke-dasharray="3 3"/>
    <!-- coil -->
    <rect x="318" y="232" width="28" height="36" fill="#ffffff"/>
    <path d="M318 268 L346 232"/>
    <path d="M318 250 H296" stroke-dasharray="3 3"/>
  </g>
  <path d="M284 276 l-7 -1 l4 -5 z" fill="#57606a"/>
  <circle cx="250" cy="250" r="3" fill="#1f2328"/>
  <g class="m">
    <text x="228" y="214">NC</text>
    <text x="228" y="244">COM</text>
    <text x="228" y="274">NO</text>
    <text x="332" y="284" text-anchor="middle">coil</text>
  </g>
  <g fill="#ffffff" stroke="#57606a" stroke-width="2">
    <circle cx="220" cy="220" r="5"/>
    <circle cx="220" cy="250" r="5"/>
    <circle cx="220" cy="280" r="5"/>
    <circle cx="380" cy="200" r="5"/>
    <circle cx="380" cy="290" r="5"/>
    <circle cx="380" cy="320" r="5"/>
  </g>

  <!-- ================= PUMP + SUPPLY ================= -->
  <text x="80" y="208" class="h" text-anchor="middle">Pump (5V)</text>
  <circle cx="80" cy="250" r="28" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="80" y="257" text-anchor="middle" font-size="20" font-weight="700" fill="#0969da">M</text>
  <text x="68" y="296" class="m" text-anchor="end">+</text>
  <text x="118" y="244" class="m">−</text>

  <rect x="30" y="380" width="120" height="60" rx="8" class="box"/>
  <text x="90" y="406" class="t" text-anchor="middle" font-weight="600">5V USB</text>
  <text x="90" y="424" class="t" text-anchor="middle" font-weight="600">power supply</text>
  <text x="72" y="372" class="m" text-anchor="end">+</text>
  <text x="158" y="402" class="m">−</text>

  <!-- ================= SOIL MOISTURE SENSOR ================= -->
  <rect x="740" y="370" width="200" height="80" rx="6" fill="#a47148" opacity="0.28"/>
  <text x="930" y="440" class="m" text-anchor="end">soil</text>
  <rect x="800" y="310" width="16" height="115" rx="8" fill="#d0d7de" stroke="#8c959f" stroke-width="2"/>
  <rect x="864" y="310" width="16" height="115" rx="8" fill="#d0d7de" stroke="#8c959f" stroke-width="2"/>
  <text x="840" y="162" class="h" text-anchor="middle">Soil moisture sensor</text>
  <rect x="760" y="175" width="160" height="140" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <g class="t">
    <text x="772" y="234">VCC</text>
    <text x="772" y="264">GND</text>
    <text x="772" y="294">DO</text>
  </g>
  <text x="908" y="204" class="m" text-anchor="end">comparator</text>
  <g fill="#ffffff" stroke="#cf222e" stroke-width="2">
    <circle cx="760" cy="230" r="5"/>
    <circle cx="760" cy="260" r="5"/>
    <circle cx="760" cy="290" r="5"/>
  </g>

  <!-- ================= NOTES + LEGEND ================= -->
  <line x1="30" y1="470" x2="930" y2="470" stroke="#d0d7de"/>
  <text x="480" y="494" class="t" text-anchor="middle"><tspan font-weight="600">How it works:</tspan> sensor DO goes HIGH when the soil is dry → Pi drives GPIO4 LOW for 7 s → relay closes COM–NO → pump runs.</text>

  <g class="t">
    <line x1="112" y1="526" x2="142" y2="526" class="wire v5"/>
    <text x="150" y="530">5V power</text>
    <line x1="245" y1="526" x2="275" y2="526" class="wire v33"/>
    <text x="283" y="530">3.3V power</text>
    <line x1="388" y1="526" x2="418" y2="526" class="wire gnd"/>
    <text x="426" y="530">Ground</text>
    <line x1="508" y1="526" x2="538" y2="526" class="wire sig"/>
    <text x="546" y="530">Sensor signal (DO)</text>
    <line x1="696" y1="526" x2="726" y2="526" class="wire ctl"/>
    <text x="734" y="530">Relay control (IN1)</text>
  </g>
</svg>
